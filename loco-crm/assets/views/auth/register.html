{% extends "layouts/base.html" %}
{% block title %}Register · Loco CRM{% endblock %}
{% block content %}
<section class="auth card">
  <h1>Create an account</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="stack">
    <label>Name <input name="name" value="{{ name }}" required autofocus></label>
    <label>Email <input type="email" name="email" value="{{ email }}" required></label>
    <label>Password <input type="password" name="password" minlength="2" required></label>
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="/login">Log in</a></p>
</section>
{% endblock %}
